<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5"><title>Quantum Hub</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#1c1d2b;--mu:#6b6f85;--pr:#7c3aed;--bd:#e3e5f0}
@media(prefers-color-scheme:dark){:root{--bg:#0f1020;--card:#1b1c33;--tx:#ecedf7;--mu:#9a9db8;--bd:#2c2e4d}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:15px system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{background:linear-gradient(120deg,#7c3aed,#ec4899 55%,#06b6d4);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:18px}header small{opacity:.85;display:block;font-size:11px}
button,input,textarea{font:inherit;color:inherit}
button{background:linear-gradient(120deg,#7c3aed,#ec4899);color:#fff;border:0;border-radius:10px;padding:9px 14px;cursor:pointer}
button.g{background:transparent;color:var(--pr);border:1px solid var(--bd)}
input,textarea{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin:4px 0}
#tabs{display:flex;gap:6px;overflow-x:auto;padding:8px;background:var(--card);border-bottom:1px solid var(--bd)}
#tabs button{background:var(--bg);color:var(--tx);white-space:nowrap;border:1px solid var(--bd)}
#tabs button.on{background:linear-gradient(120deg,#7c3aed,#ec4899);color:#fff;border-color:transparent;box-shadow:0 0 12px #ec489988}
#feed{flex:1;overflow-y:auto;padding:10px}
.msg{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:8px;max-width:100%}
.msg h6{margin:0 0 4px;font-size:12px;color:var(--mu);font-weight:600}
.msg p{margin:0;white-space:pre-wrap;word-break:break-word}
.msg img{max-width:100%;border-radius:8px;margin-top:6px}
.msg a{color:var(--pr);word-break:break-all;display:block;margin-top:6px}
.tag{background:#16a34a;color:#fff;border-radius:6px;padding:1px 7px;font-size:12px}
.x{background:none;color:#dc2626;padding:2px 6px;font-size:12px}
#comp{padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--bd)}
#comp .r{display:flex;gap:6px;align-items:center}
.c{max-width:420px;margin:0 auto;padding:20px;width:100%}
.hide{display:none!important}.note{color:var(--mu);font-size:13px;margin:6px 0}
#cap{padding:8px 12px;font-size:13px;font-weight:600;color:var(--pr)}.msg{box-shadow:0 2px 10px #7c3aed18}#tabs button,.msg,input,textarea{border-radius:14px}
.logo{width:96px;height:96px;border-radius:24px;box-shadow:0 8px 30px #7c3aed66;display:block;margin:30px auto 8px}.hero{text-align:center}.hero h2{margin:6px;font-size:28px;background:linear-gradient(120deg,#7c3aed,#ec4899,#06b6d4);-webkit-background-clip:text;background-clip:text;color:transparent}
</style></head><body>
<div id="auth" class="c"><div class="hero"><img class="logo" src="icon-192.png" alt=""><h2>Quantum Hub</h2><p class="note">Where Physics Minds Connect ⚛️✨<br>No cap, just physics. 🧠🔥</p></div>
<input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password (min 6 characters)">
<p id="err" style="color:#dc2626;font-size:13px"></p>
<button id="si" style="width:100%">Sign in</button><br><br>
<button id="su" class="g" style="width:100%">Create account</button><br><br>
<button id="go" class="g" style="width:100%">Continue with Google</button></div>

<div id="app" class="hide" style="flex:1;display:flex;flex-direction:column;min-height:0">
<header><div><b>⚛️ Quantum Hub ✨</b><small id="who"></small></div><button class="g" id="out" style="color:#fff;border-color:#fff8">Sign out</button></header>
<div id="tabs"></div><div id="cap"></div><div id="feed"></div>
<div id="comp"><div id="ex"></div>
<div class="r"><textarea id="tx" rows="1" placeholder="Write a message..."></textarea>
<button class="g" id="pic">📷</button><button id="snd">Send 🚀</button></div>
<input type="file" id="fi" accept="image/*" class="hide"></div></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,GoogleAuthProvider,signInWithPopup,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,collection,addDoc,query,where,onSnapshot,deleteDoc,doc,getDoc,setDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const cfg={apiKey:"AIzaSyCxMqyNR0PJaA6cLkpmrnAe8O6Z2KOYjog",authDomain:"quantum-hub-e7a70.firebaseapp.com",projectId:"quantum-hub-e7a70",storageBucket:"quantum-hub-e7a70.firebasestorage.app",messagingSenderId:"103533072408",appId:"1:103533072408:web:db798ed28dfd6db2ea736d"};
const ADMIN="beingjunaidaziz@gmail.com";
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
const ROOMS=[["mphil","🎓 MPhil Batch"],["juniors","👥 Juniors"],["paid","💼 Paid Help"],["help","📚 Help & Papers"],["confess","🤫 Confessions"],["complaints","📨 Complaints"],["profile","👤 Profile"]];
const HINT={mphil:"Message to MPhil batch",juniors:"Message to Juniors",paid:"Describe your paid assignment/PDF offer",help:"Ask for or share a past paper",confess:"Post anonymously (admin can moderate)",complaints:"Private: only you and the admin can see this"};
const CAP={mphil:"🎓 Research mode: ON. Big brains only 🧠",juniors:"👥 Seniors got your back. Ask anything, no cringe 💜",paid:"💼 Side hustle corner: offers, assignments, glow-ups 💸",help:"📚 Past papers = cheat codes. Share the W 🙌",confess:"🤫 Spill the tea, stay anonymous ☕ (be kind!)",complaints:"📨 Direct line to the admin. Only you and admin can see this 🔒",profile:"👤 Main character energy. Set your vibe ✨"};
let user,me={},isAdmin=false,cur="mphil",unsub=null,img="";

const err=e=>$("err").textContent=(e.code||e.message||"").replace("auth/","");
$("si").onclick=()=>signInWithEmailAndPassword(auth,$("em").value,$("pw").value).catch(err);
$("su").onclick=()=>createUserWithEmailAndPassword(auth,$("em").value,$("pw").value).catch(err);
$("go").onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(err);
$("out").onclick=()=>signOut(auth);

onAuthStateChanged(auth,async u=>{
 user=u;$("auth").classList.toggle("hide",!!u);$("app").classList.toggle("hide",!u);
 if(!u){unsub&&unsub();return}
 isAdmin=u.email===ADMIN;
 try{const s=await getDoc(doc(db,"users",u.uid));me=s.exists()?s.data():{}}catch(e){me={}}
 me.name=me.name||u.displayName||u.email.split("@")[0];
 $("who").textContent=me.name+(isAdmin?" · Admin":"");
 tabs();show("mphil");
});
function tabs(){$("tabs").innerHTML="";ROOMS.forEach(([k,l])=>{const b=document.createElement("button");b.textContent=l;b.id="t_"+k;b.onclick=()=>show(k);$("tabs").appendChild(b)})}
function show(r){
 cur=r;unsub&&unsub();unsub=null;img="";
 ROOMS.forEach(([k])=>$("t_"+k).classList.toggle("on",k===r));$("cap").textContent=CAP[r];
 $("comp").classList.toggle("hide",r==="profile");
 if(r==="profile")return profile();
 $("tx").placeholder=HINT[r];
 $("ex").innerHTML=r==="paid"?'<input id="pr" placeholder="Price (e.g. Rs 500)"><input id="lk" placeholder="Contact / link (WhatsApp number or Drive link)">':r==="help"||r==="mphil"||r==="juniors"?'<input id="lk" placeholder="PDF link (Google Drive etc.) - optional">':"";
 if(me.blocked){$("feed").innerHTML='<p class="note">Your account is blocked by the admin.</p>';return}
 const col=collection(db,"posts");
 const q=r==="complaints"&&!isAdmin?query(col,where("room","==",r),where("uid","==",user.uid)):query(col,where("room","==",r));
 unsub=onSnapshot(q,s=>{
  const a=s.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>(x.t?.seconds||9e9)-(y.t?.seconds||9e9));
  const f=$("feed");f.innerHTML="";
  if(!a.length)f.innerHTML='<p class="note" style="text-align:center;font-size:16px">👀 It is giving... empty.<br>Drop the first message!</p>';
  a.forEach(p=>f.appendChild(card(p)));f.scrollTop=f.scrollHeight;
 },e=>$("feed").innerHTML='<p class="note">Cannot load: '+e.code+'. Check Firestore rules.</p>');
}
function card(p){
 const d=document.createElement("div");d.className="msg";
 const h=document.createElement("h6");h.textContent=(p.name||"?")+(p.t?" · "+new Date(p.t.seconds*1000).toLocaleString([], {dateStyle:"short",timeStyle:"short"}):"");
 d.appendChild(h);
 if(p.price){const t=document.createElement("span");t.className="tag";t.textContent=p.price;d.appendChild(t)}
 if(p.text){const t=document.createElement("p");t.textContent=p.text;d.appendChild(t)}
 if(p.img){const i=document.createElement("img");i.src=p.img;d.appendChild(i)}
 if(p.link){const a=document.createElement("a");a.textContent=p.link;a.href=/^https?:\/\//.test(p.link)?p.link:(/^[\d+ ]+$/.test(p.link)?"https://wa.me/"+p.link.replace(/\D/g,""):"#");a.target="_blank";a.rel="noopener";d.appendChild(a)}
 if(isAdmin||p.uid===user.uid){const x=document.createElement("button");x.className="x";x.textContent="Delete";x.onclick=()=>confirm("Delete this post?")&&deleteDoc(doc(db,"posts",p.id));d.appendChild(x)}
 if(isAdmin&&p.uid!==user.uid){const b=document.createElement("button");b.className="x";b.textContent="Block user";b.onclick=()=>confirm("Block this user?")&&setDoc(doc(db,"users",p.uid),{blocked:true},{merge:true});d.appendChild(b)}
 return d;
}
$("pic").onclick=()=>$("fi").click();
$("fi").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,800/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);img=c.toDataURL("image/jpeg",.6);$("pic").textContent="✅"};i.src=r.result};r.readAsDataURL(f)};
$("snd").onclick=async()=>{
 if(me.blocked)return;
 const text=$("tx").value.trim(),link=$("lk")?$("lk").value.trim():"",price=$("pr")?$("pr").value.trim():"";
 if(!text&&!img&&!link)return;
 try{await addDoc(collection(db,"posts"),{room:cur,uid:user.uid,name:cur==="confess"?"Anonymous":me.name,text,img,link,price,t:serverTimestamp()})}catch(e){alert("Could not send: "+e.code);return}
 $("tx").value="";img="";$("pic").textContent="📷";if($("lk"))$("lk").value="";if($("pr"))$("pr").value="";
};
function profile(){
 $("feed").innerHTML='<div class="c"><h3>My Profile</h3><input id="pn" placeholder="Your name"><input id="ps" placeholder="Status (e.g. Busy in thesis)"><p class="note">Profile photo (optional)</p><input type="file" id="pf" accept="image/*"><br><br><button id="sv">Save profile</button><p class="note" id="pm"></p></div>';
 $("pn").value=me.name||"";$("ps").value=me.status||"";
 let ph=me.photo||"";
 $("pf").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement("canvas");c.width=c.height=128;const m=Math.min(i.width,i.height);c.getContext("2d").drawImage(i,(i.width-m)/2,(i.height-m)/2,m,m,0,0,128,128);ph=c.toDataURL("image/jpeg",.7)};i.src=r.result};r.readAsDataURL(f)};
 $("sv").onclick=async()=>{me={...me,name:$("pn").value.trim()||me.name,status:$("ps").value.trim(),photo:ph};
  try{await setDoc(doc(db,"users",user.uid),{name:me.name,status:me.status,photo:me.photo,email:user.email},{merge:true});$("who").textContent=me.name+(isAdmin?" · Admin":"");$("pm").textContent="Saved ✅"}catch(e){$("pm").textContent="Error: "+e.code}};
}
</script></body></html>
